<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lanternwalk: one lit lantern over a night path. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="1" stop-color="#1d2452"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="236" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd98f" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffaf4d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffaf4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f3e4c4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#f3e4c4" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <circle cx="256" cy="236" r="190" fill="url(#glow)"/>
  <path d="M0 400 C120 362 210 384 300 366 S440 350 512 372 V512 H0z" fill="#0b1029"/>
  <path d="M196 512 C230 450 214 420 250 384 L262 384 C286 424 300 456 316 512z" fill="url(#path)"/>
  <!-- the lantern -->
