  <path d="M206 162 h100 l18 28 v108 l-18 28 h-100 l-18 -28 v-108z" fill="#ffd68c" fill-opacity=".22" stroke="#f3d9a4" stroke-width="13" stroke-linejoin="round"/>
  <path d="M256 196 c30 33 30 63 0 90 c-30 -27 -30 -57 0 -90z" fill="#ffc86b"/>
  <path d="M256 228 c12 14 12 28 0 40 c-12 -12 -12 -26 0 -40z" fill="#fff4d6"/>
</svg>
